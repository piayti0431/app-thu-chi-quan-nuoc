<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mungBean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/><stop offset="60%" stop-color="#eab308"/><stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="74" fill="#fefce8" stroke="#fef08a" stroke-width="2"/>

  <!-- Bowl -->
  <path d="M30 86 Q80 148 130 86 Z" fill="url(#bowlGrad)" stroke="#94a3b8" stroke-width="2.5"/>
  <ellipse cx="80" cy="86" rx="50" ry="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="80" cy="84" rx="47" ry="12" fill="#ca8a04"/>

  <!-- Heap of yellow mung beans -->
  <ellipse cx="80" cy="74" rx="42" ry="16" fill="url(#mungBean)"/>
  <ellipse cx="80" cy="66" rx="32" ry="12" fill="url(#mungBean)"/>
  <ellipse cx="80" cy="58" rx="20" ry="8" fill="url(#mungBean)"/>

  <!-- Individual beans on top -->
  <ellipse cx="68" cy="62" rx="6" ry="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1" transform="rotate(-15 68 62)"/>
  <ellipse cx="84" cy="58" rx="6" ry="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1" transform="rotate(20 84 58)"/>
  <ellipse cx="96" cy="66" rx="6" ry="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1" transform="rotate(-10 96 66)"/>
  <ellipse cx="78" cy="68" rx="6" ry="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1" transform="rotate(5 78 68)"/>

  <!-- Green bean pods background -->
  <path d="M40 40 Q70 28 100 35" stroke="#65a30d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="36" r="3" fill="#84cc16"/>
  <circle cx="70" cy="33" r="3" fill="#84cc16"/>
  <circle cx="88" cy="34" r="3" fill="#84cc16"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <circle cx="80" cy="80" r="74" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>

  <!-- Bag packaging wrapper -->
  <rect x="36" y="24" width="88" height="114" rx="8" fill="#ffffff" opacity="0.6" stroke="#fb7185" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Straw 1 (Red stripe) -->
  <g transform="rotate(-15 80 80)">
    <rect x="62" y="20" width="10" height="120" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
    <line x1="62" y1="35" x2="72" y2="40" stroke="#e11d48" stroke-width="3"/>
    <line x1="62" y1="55" x2="72" y2="60" stroke="#e11d48" stroke-width="3"/>
    <line x1="62" y1="75" x2="72" y2="80" stroke="#e11d48" stroke-width="3"/>
    <line x1="62" y1="95" x2="72" y2="100" stroke="#e11d48" stroke-width="3"/>
    <line x1="62" y1="115" x2="72" y2="120" stroke="#e11d48" stroke-width="3"/>
  </g>

  <!-- Straw 2 (Green) -->
  <g transform="rotate(5 80 80)">
    <rect x="75" y="18" width="10" height="124" rx="4" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
    <line x1="75" y1="35" x2="85" y2="40" stroke="#ffffff" stroke-width="3"/>
    <line x1="75" y1="65" x2="85" y2="70" stroke="#ffffff" stroke-width="3"/>
    <line x1="75" y1="95" x2="85" y2="100" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Straw 3 (Yellow) -->
  <g transform="rotate(25 80 80)">
    <rect x="88" y="22" width="10" height="118" rx="4" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="88" y1="40" x2="98" y2="45" stroke="#ea580c" stroke-width="3"/>
    <line x1="88" y1="70" x2="98" y2="75" stroke="#ea580c" stroke-width="3"/>
    <line x1="88" y1="100" x2="98" y2="105" stroke="#ea580c" stroke-width="3"/>
  </g>

  <!-- Bendable flex neck detail -->
  <g transform="translate(68, 42)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="4" x2="24" y2="4" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="8" x2="24" y2="8" stroke="#cbd5e1" stroke-width="2"/>
  </g>
</svg>
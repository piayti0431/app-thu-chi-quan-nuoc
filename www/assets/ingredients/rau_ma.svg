<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/><stop offset="60%" stop-color="#16a34a"/><stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/><stop offset="60%" stop-color="#22c55e"/><stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="74" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <!-- Stems -->
  <path d="M48 140 Q60 100 65 75" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M78 142 Q80 90 85 55" stroke="#15803d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M108 140 Q98 105 102 78" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Left Pennywort leaf -->
  <g transform="translate(62, 70)">
    <path d="M0 0 C-30 -25 -30 25 0 30 C30 25 30 -25 0 0 Z" fill="url(#leafGrad1)" stroke="#14532d" stroke-width="1.5" transform="rotate(-20)"/>
    <circle cx="-3" cy="8" r="2.5" fill="#f0fdf4"/>
  </g>

  <!-- Right Pennywort leaf -->
  <g transform="translate(102, 72)">
    <path d="M0 0 C-28 -22 -28 22 0 28 C28 22 28 -22 0 0 Z" fill="url(#leafGrad1)" stroke="#14532d" stroke-width="1.5" transform="rotate(25)"/>
    <circle cx="3" cy="8" r="2.5" fill="#f0fdf4"/>
  </g>

  <!-- Big Center Pennywort leaf -->
  <g transform="translate(85, 48)">
    <path d="M0 0 C-38 -30 -38 32 0 38 C38 32 38 -30 0 0 Z" fill="url(#leafGrad2)" stroke="#14532d" stroke-width="2"/>
    <!-- Veins radiating from center notch -->
    <path d="M0 12 Q-18 -8 -26 -12 M0 12 Q18 -8 26 -12 M0 12 Q-20 18 -26 22 M0 12 Q20 18 26 22 M0 12 L0 32" stroke="#bbf7d0" stroke-width="1.5" fill="none" opacity="0.75"/>
    <circle cx="0" cy="12" r="3.5" fill="#f0fdf4"/>
  </g>

  <!-- Dew drops -->
  <circle cx="75" cy="40" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="98" cy="52" r="2" fill="#ffffff" opacity="0.8"/>
</svg>
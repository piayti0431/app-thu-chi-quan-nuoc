<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="30%" stop-color="#e0f2fe" stop-opacity="0.6"/><stop offset="80%" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="100%" stop-color="#bae6fd" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="74" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Stacked cups in background -->
  <path d="M50 35 L110 35 L102 95 L58 95 Z" fill="url(#cupGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <path d="M50 45 L110 45 L102 105 L58 105 Z" fill="url(#cupGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>


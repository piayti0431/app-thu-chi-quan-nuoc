  <!-- Bottom metal rim -->
  <ellipse cx="80" cy="125" rx="38" ry="12" fill="url(#metalRim)" stroke="#64748b" stroke-width="2"/>

  <!-- Can Label graphics (Ông Thọ / Star) -->
  <rect x="42" y="60" width="76" height="50" fill="#ffffff" opacity="0.95"/>
  <rect x="42" y="70" width="76" height="30" fill="#ef4444"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="30%" stop-color="#38bdf8"/><stop offset="70%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/><stop offset="50%" stop-color="#ffffff"/><stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="74" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
  <!-- Can Body -->
  <path d="M42 45 L118 45 L118 125 L42 125 Z" fill="url(#canBody)" stroke="#0369a1" stroke-width="2"/>

